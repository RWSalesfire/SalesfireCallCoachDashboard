name: Keepalive

# GitHub disables scheduled workflows after 60 days with no commits to the
# default branch. That silently killed the pipeline cron on 8 June 2026, and
# again on 21 August 2026.
#
# The second outage happened because this job depended on
# gautamkrishnar/keepalive-workflow, which GitHub has since blocked (HTTP 403),
# so the step failed on every run. It now calls the GitHub API directly:
# re-enabling a workflow resets its inactivity timer, and it is a no-op if the
# workflow is already enabled. No third-party action, no commits.

on:
  schedule:
    # Every Monday at 04:00 UTC, comfortably inside the 60-day window
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Reset inactivity timer on every scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in pipeline-cron.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "kept alive: $wf"
          done
