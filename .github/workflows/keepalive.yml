name: Keepalive

# GitHub disables scheduled workflows after 60 days with no commits to the
# default branch. That silently killed the pipeline cron on 8 June 2026.
# This job resets the inactivity timer well inside the 60-day window so the
# pipeline-cron schedule can never be auto-disabled again.

on:
  schedule:
    # Every Monday at 04:00 UTC — comfortably inside the 60-day window
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset inactivity timer
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
